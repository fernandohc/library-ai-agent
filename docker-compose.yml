services:
  mongodb:
    image: mongo:8
    container_name: library-mongodb
    restart: unless-stopped
    
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: library_ai

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db
      - ./docker/mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro

  library-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library-ai-api
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: mongodb://library_app:library_app_password@mongodb:27017/library_ai?authSource=library_ai
      MONGODB_DATABASE: library_ai
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    
volumes:
  mongodb_data:
